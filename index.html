<style>
 * {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    color: white;
    font-family: "Comic Sans MS", "Comic Sans", cursive;

    background-image: url("hername.png");

    background-position: center top;

/* navigate here (i liekk uuuuu) */

header {
    height: 65px;
    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(0, 0, 0, 0.12);
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 20px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {

    text-decoration: none;

    font-size: 14px;
}

nav a:hover {
    text-decoration: underline;
}


/* homee (your heart my home) */

.home {
    min-height: calc(100vh - 65px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;
}

.small {
    margin: 0 0 15px;

    font-size: 14px;
}

.home h1 {
    margin: 0;

    font-size: clamp(45px, 8vw, 80px);
    line-height: 1.1;
    font-weight: bold;
}

.home h1 i {
    font-style: normal;
}

.intro {
    margin-top: 25px;

    font-size: 15px;
    line-height: 1.6;
}


/* blue videos */

.videos {
    width: 90%;
    max-width: 1100px;

    margin: auto;
    padding: 80px 0 120px;
}

.videos h2 {
    margin: 0;

    font-size: 42px;
    font-weight: bold;
}

.count {
    margin: 5px 0 30px;

    font-size: 13px;
}


/* personal youtube */

.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;

    text-align: left;
}

.card {
    overflow: hidden;

    background: rgba(255, 255, 255, 0.82);

    border-radius: 12px;

    color: #493b40;

    cursor: pointer;

    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
}

.thumbnail {
    position: relative;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #e8cbd3;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.play {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.9);

    font-family: Arial, sans-serif;
    font-size: 16px;
}

.card-info {
    padding: 16px;
}

.card-info .category {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.card-info h3 {
    margin: 6px 0;

    font-size: 21px;
    font-weight: bold;
}

.card-info p {
    margin: 0;

    font-size: 13px;
    line-height: 1.5;
}


/* websites */

.websites {
    width: 90%;
    max-width: 1100px;

    margin: auto;
    padding: 60px 0 120px;
}

.websites h2 {
    margin: 0;

    font-size: 42px;
    font-weight: bold;
}

.website-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;

    margin-top: 30px;

    text-align: left;
}

.website-card {
    overflow: hidden;

    background: rgba(255, 255, 255, 0.82);

    border-radius: 12px;

    color: #493b40;

    transition: 0.2s;
}

.website-card:hover {
    transform: translateY(-4px);
}

.website-card img {
    width: 100%;
    height: 230px;

    display: block;

    object-fit: cover;
}

.website-info {
    padding: 16px;
}

.website-info h3 {
    margin: 6px 0;

    font-size: 21px;
    font-weight: bold;
}

.website-info p {
    margin: 0 0 15px;

    font-size: 13px;
    line-height: 1.5;
}

.website-info a {
    color: #493b40;

    font-size: 13px;
    font-weight: bold;

    text-decoration: none;
}

.website-info a:hover {
    text-decoration: underline;
}


/* your mini theatre */

.popup {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 100;

    padding: 20px;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.65);
}

.popup.show {
    display: flex;
}

.popup-box {
    position: relative;

    width: 900px;
    max-width: 100%;

    overflow: hidden;

    background: white;

    border-radius: 12px;

    color: #493b40;
}

#close {
    position: absolute;

    top: 10px;
    right: 10px;

    z-index: 2;

    width: 35px;
    height: 35px;

    border: 0;
    border-radius: 50%;

    background: white;

    font-family: Arial, sans-serif;
    font-size: 23px;

    cursor: pointer;
}

.video {
    aspect-ratio: 16 / 9;

    background: black;
}

.video iframe {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;
}

.info {
    padding: 20px;

    text-align: left;
}

.info #category {
    margin: 0;

    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.info h2 {
    margin: 5px 0;

    font-size: 27px;
    font-weight: bold;
}

.info #description {
    margin: 0;

    font-size: 14px;
}


/* feet (lick lick) */

.play-logo {
    width: 180px;
    height: 190px;
    object-fit: contain;
}

footer {
    padding: 50px 20px;

    font-size: 12px;
}


/* fone */

@media (max-width: 750px) {

    .video-grid {
        grid-template-columns: 1fr;
    }

    .home h1 {
        font-size: 48px;
    }

}

@media (max-width: 500px) {

    header {
        padding: 0 5%;
    }

    nav {
        gap: 15px;
    }

    .videos h2,
    .websites h2 {
        font-size: 36px;
    }

    }

@media (max-width: 500px) {

    .card-info h3,
    .website-info h3,
    .info h2 {
        font-family: Arial, sans-serif;
        font-weight: 700;
    }

}
</style>
